name: Publish Buyable Brand OS
on:
  push:
    branches: [arena/42722a3e-hendrixx]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: brand-os-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test brand-os/test/engine.test.js brand-os/test/agents.test.js
      - run: node brand-os/web/build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: brand-os/web/site
      - uses: actions/deploy-pages@v4
        id: deployment
