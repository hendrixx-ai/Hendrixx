<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Buyable Brand OS — orchestrate the $10k system</title>
<meta name="description" content="A working operating system for The Buyable Brand: offer ladder, 30-day content engine, DM pipeline, funnel math and the 90-day plan — orchestrated into what matters today." />
<meta name="theme-color" content="#0b0b0d" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0b0d'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' fill='%23e9b95f' text-anchor='middle'%3EBB%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <aside class="rail" id="rail">
    <div class="rail-top">
      <div class="monogram">BB</div>
      <div class="rail-title">
        <strong>Buyable Brand</strong>
        <span>Operating System</span>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="Sections"></nav>

    <div class="rail-foot">
      <div class="rail-goal" id="railGoal"></div>
      <button class="rail-btn" data-act="settings">
        <span class="ico">⚙</span><span>Setup &amp; links</span>
      </button>
      <a class="rail-btn" href="/api/export" download>
        <span class="ico">↓</span><span>Export state</span>
      </a>
      <p class="rail-note">Local-first. Nothing is sent, posted or charged from here. You do the external actions.</p>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn only-mobile" data-act="menu" aria-label="Menu">☰</button>
        <div>
          <h1 id="viewTitle">Today</h1>
          <p id="viewSub" class="topbar-sub">Your runbook</p>
        </div>
      </div>
      <div class="topbar-right">
        <span class="chip" id="dayChip"></span>
        <span class="chip chip-live" id="goalChip"></span>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <footer class="foot">
      <span>Built from <code>BUYABLE-BRAND-BUSINESS-PLAN.md</code> — the repo is the database.</span>
      <span id="footDay"></span>
    </footer>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
